<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wayfund</title>
    <meta name="description" content="Plan, budget and share your gap year." />
    <meta name="theme-color" content="#e2f4f0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iPhone home-screen support -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wayfund" />
    <!-- Apply the colour theme and dark mode before the page draws, so there's no flash. -->
    <script>
      try {
        var t = localStorage.getItem("gap-year-theme");
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
        var p = localStorage.getItem("gap-year-palette");
        if (["purple", "sunset", "earthy", "navy", "charcoal"].indexOf(p) >= 0) document.documentElement.setAttribute("data-palette", p);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
