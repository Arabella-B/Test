<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arabella's Test Site</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, system-ui, sans-serif;
      background: #f4f1ea;
      color: #2b2b2b;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 { margin-top: 0; }
    p { line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from my test site 👋</h1>
    <p>I built this with Claude Code to learn how GitHub, Render and Claude fit together.</p>
  </div>
</body>
</html>
